<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODE_03 // TERMINAL</title>
    <style>
        body {
            background-color: #050505;
            color: #a0a0a0;
            font-family: "Courier New", Courier, monospace;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            user-select: none;
            overflow: hidden;
            transition: background-color 0.1s;
        }
        .terminal { width: 100%; max-width: 600px; }
        .line { margin-bottom: 10px; line-height: 1.5; }
        .red { color: #8b0000; }
        input[type="text"] {
            background-color: transparent; border: none; border-bottom: 1px solid #555;
            color: #fff; font-family: "Courier New", Courier, monospace;
            font-size: 16px; padding: 5px; width: 80%; outline: none; margin-top: 20px;
        }
        button {
            background-color: transparent; border: 1px solid #555; color: #a0a0a0;
            font-family: "Courier New", Courier, monospace; padding: 5px 15px;
            cursor: pointer; margin-left: 10px;
        }
        button:hover { background-color: #222; color: #fff; }
        
        .hidden-msg {
            display: none; 
            margin-top: 30px; 
            color: #8b0000;
            font-size: 20px; 
            text-align: center; 
            letter-spacing: 2px;
        }

        #glitchImage {
            display: none;
            max-width: 100%;
            max-height: 60vh;
            margin-top: 20px;
            border: 2px solid #8b0000;
            box-shadow: 0 0 30px #8b0000;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        .glitch {
            animation: glitch-anim 0.1s infinite;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); filter: invert(0); }
            20% { transform: translate(-5px, 5px); filter: invert(1); }
            40% { transform: translate(-5px, -5px); filter: invert(0); }
            60% { transform: translate(5px, 5px); filter: hue-rotate(90deg); }
            80% { transform: translate(5px, -5px); filter: invert(1); }
            100% { transform: translate(0); filter: invert(0); }
        }
    </style>
</head>
<body>

    <audio id="bgAudio" loop>
        <source src="qlham_sstv.wav" type="audio/wav">
    </audio>

    <div class="terminal" id="mainTerminal">
        <div class="line">> INITIALIZING SECURE NODE_03...</div>
        <div class="line">> CONNECTION ESTABLISHED_</div>
        <div class="line">> WARNING: DATA IS CORRUPTED.</div>
        <div class="line">> BACKGROUND FREQUENCY DETECTED.</div>
        <br>
        <div class="line">The file has mutated. What is the new command?</div>
        
        <div style="margin-top: 30px;">
            <span>> </span>
            <input type="text" id="passInput" placeholder="Enter the command..." autocomplete="off">
            <button onclick="checkPassword()">[ EXECUTE ]</button>
        </div>
        <div id="resultArea" class="line" style="margin-top: 20px;"></div>
    </div>

    <div id="successScreen" class="hidden-msg">
        <p id="msg1">COMMAND ACCEPTED.</p>
        <p id="msg2">The resistance has been deleted.</p>
        <p id="msg3">There is no one left to save you.</p>
        <p id="msg4" style="font-size: 12px; margin-top: 50px;">[ SYSTEM PURGE INITIATED... ]</p>
        <img id="glitchImage" src="record04.png" alt="RECORD_04">
    </div>

    <script>
        var _k3y_old = "the key to resistance";
        var _k3y_new = ["44", "65", "6c", "65", "74", "65", "20", "74", "68", "65", "20", "6b", "65", "79", "20", "74", "6f", "20", "72", "65", "73", "69", "73", "74", "61", "6e", "63", "65"];

        function _d() {
            var s = "";
            for(var i=0; i<_k3y_new.length; i++){
                s += String.fromCharCode(parseInt(_k3y_new[i], 16));
            }
            return s;
        }

        function checkPassword() {
            var input = document.getElementById("passInput").value.trim();
            var result = document.getElementById("resultArea");
            var terminal = document.getElementById("mainTerminal");
            var success = document.getElementById("successScreen");

            if (input.toLowerCase() === _k3y_old.toLowerCase()) {
                result.innerHTML = "<span class='red'>THE KEY IS NOT ENOUGH. IT MUST BE DELETED.</span>";
                document.getElementById("passInput").value = "";
                return;
            }

            if (input.toLowerCase() === _d().toLowerCase()) {
                terminal.style.display = "none";
                success.style.display = "block";
                document.title = "SYSTEM PURGE.";
                triggerFinale();
            } else if (input === "") {
                result.innerHTML = "<span class='red'>Input cannot be empty.</span>";
            } else {
                result.innerHTML = "<span class='red'>DECRYPTION FAILED. IT KNOWS YOU TRIED.</span>";
                document.getElementById("passInput").value = "";
            }
        }

        function triggerFinale() {
            setTimeout(function() {
                document.body.classList.add('glitch');
                document.title = "IT SEES YOU.";
                
                var audio = document.getElementById('bgAudio');
                if(audio) { audio.playbackRate = 0.5; }

                document.getElementById("msg1").innerText = "DELETE";
                document.getElementById("msg1").style.color = "#ff0000";
                document.getElementById("msg1").style.fontSize = "50px";
                document.getElementById("msg2").innerText = "";
                document.getElementById("msg3").innerText = "";
                document.getElementById("msg4").innerText = "";

                setTimeout(function() {
                    document.body.classList.remove('glitch');
                    document.body.style.backgroundColor = "#000";
                    if(audio) { audio.pause(); }
                    
                    document.getElementById("msg1").innerText = "RECORD_04 FOUND.";
                    document.getElementById("msg1").style.color = "#fff";
                    document.getElementById("msg1").style.fontSize = "24px";
                    
                    document.getElementById("msg2").innerText = "It is closer now.";
                    document.getElementById("msg2").style.color = "#8b0000";
                    
                    var img = document.getElementById("glitchImage");
                    img.style.display = "inline-block";
                    
                    setTimeout(function() {
                        img.style.opacity = "1";
                    }, 100);

                }, 4000);

            }, 5000);
        }

        document.getElementById("passInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { event.preventDefault(); checkPassword(); }
        });

        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i'))) {
                e.preventDefault();
                document.body.innerHTML = "<div style='color:#8b0000; font-family:monospace; padding:50px; text-align:center; font-size:20px;'>[ CHEATING DETECTED. ]<br><br>IT SEES YOU NOW.</div>";
            }
        });

        document.addEventListener('click', function() {
            var audio = document.getElementById('bgAudio');
            if (audio && audio.paused) { audio.play(); }
        });

        document.addEventListener('touchstart', function() {
            var audio = document.getElementById("bgAudio");
            if (audio && audio.paused) { audio.play(); }
        }, false);
    </script>
</body>
</html>
